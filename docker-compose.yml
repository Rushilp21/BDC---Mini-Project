services:
  kafka:
    image: apache/kafka:3.7.1
    ports: ["127.0.0.1:9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes: ["kafka-data:/var/lib/kafka/data"]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:29092 --list >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 30
  topic:
    image: apache/kafka:3.7.1
    depends_on:
      kafka: {condition: service_healthy}
    entrypoint: ["/opt/kafka/bin/kafka-topics.sh"]
    command: ["--bootstrap-server", "kafka:29092", "--create", "--if-not-exists", "--topic", "breach-hashes", "--partitions", "1", "--replication-factor", "1"]
  backend:
    build: .
    environment:
      ADMIN_TOKEN: ${ADMIN_TOKEN:-local-demo-admin}
      KAFKA_BOOTSTRAP: kafka:29092
      DATA_DIR: /app/data
    ports: ["127.0.0.1:8000:8000"]
    volumes: ["${DATA_PATH:-./data}:/app/data", "./artifacts:/app/artifacts"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 5s
      timeout: 5s
      retries: 30
  stream:
    build: .
    command: ["sh", "-c", "spark-submit --packages org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.7 /app/spark/streaming_pipeline.py"]
    environment:
      ADMIN_TOKEN: ${ADMIN_TOKEN:-local-demo-admin}
      KAFKA_BOOTSTRAP: kafka:29092
      BACKEND_URL: http://backend:8000
      DATA_DIR: /app/data
    volumes: ["${DATA_PATH:-./data}:/app/data"]
    depends_on:
      backend: {condition: service_healthy}
      topic: {condition: service_completed_successfully}
  frontend:
    build: ./frontend
    ports: ["127.0.0.1:5173:80"]
    depends_on: [backend]
volumes:
  kafka-data:
